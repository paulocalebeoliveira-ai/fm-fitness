<style>
  :root{
    --bg:#12181C; --bg-panel:#182027; --bg-panel-2:#1E272E; --line:#2A343B;
    --text:#F1ECE3; --text-dim:#8B93A0; --accent:#FF4B2B; --accent-dim:#7A2E20;
    --good:#7A9A6E; --good-dim:#2C3A28; --warn:#E8B84B; --warn-dim:#4A3D1E; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;}
  h1,h2,h3,.display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;} button{font-family:inherit;cursor:pointer;} input,select,textarea{font-family:inherit;}
  #app{min-height:100vh;}
  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .auth-card{width:100%;max-width:420px;background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:32px;position:relative;overflow:hidden;}
  .auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:repeating-linear-gradient(90deg,var(--accent) 0 18px,transparent 18px 26px);}
  .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
  .brand .num{font-family:'Oswald';font-weight:700;font-size:30px;color:var(--accent);}
  .brand .name{font-size:24px;font-weight:600;}
  .brand-sub{color:var(--text-dim);font-size:13px;margin-bottom:28px;letter-spacing:0.04em;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);margin-bottom:6px;}
  .field input,.field select{width:100%;background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:6px;font-size:14px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:6px;padding:11px 18px;font-size:14px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;transition:transform .08s ease;}
  .btn:active{transform:scale(0.97);}
  .btn[disabled]{opacity:0.6;cursor:not-allowed;}
  .btn-primary{background:var(--accent);color:#fff;width:100%;}
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--line);}
  .btn-small{padding:6px 12px;font-size:12px;width:auto;}
  .link-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;text-decoration:underline;padding:0;}
  .helper{color:var(--text-dim);font-size:12px;margin-top:4px;}
  .error-box{background:var(--accent-dim);border:1px solid var(--accent);color:#FFD9CE;padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:14px;}
  .info-box{background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text-dim);padding:10px 12px;border-radius:6px;font-size:12px;margin-top:18px;line-height:1.5;}
  .auth-switch{text-align:center;margin-top:18px;font-size:13px;color:var(--text-dim);}
  .pwd-wrap{position:relative;}
  .pwd-wrap input{padding-right:40px;}
  .pwd-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;padding:4px 6px;line-height:1;}
  .pwd-toggle:hover{color:var(--text);}
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:230px;flex-shrink:0;background:var(--bg-panel);border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;}
  .side-brand{display:flex;align-items:baseline;gap:8px;margin-bottom:34px;padding-left:6px;}
  .side-brand .num{color:var(--accent);font-family:'Oswald';font-weight:700;font-size:20px;}
  .side-brand .name{font-size:16px;font-weight:600;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;color:var(--text-dim);text-decoration:none;font-size:13px;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;border:none;background:none;width:100%;text-align:left;font-weight:500;}
  .nav-item .bib{font-family:'IBM Plex Mono';font-size:11px;width:20px;color:var(--text-dim);}
  .nav-item.active{background:var(--bg-panel-2);color:var(--text);}
  .nav-item.active .bib{color:var(--accent);}
  .nav-item:hover{color:var(--text);}
  .side-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;}
  .user-chip{display:flex;align-items:center;gap:10px;padding:8px 6px;}

  .main{flex:1;padding:32px 40px;max-width:1100px;}
  .page-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
  .page-title h1{font-size:26px;margin:0;}
  .page-sub{color:var(--text-dim);font-size:13px;margin-bottom:28px;}
  .grid{display:grid;gap:18px;} .grid-3{grid-template-columns:repeat(3,1fr);} .grid-2{grid-template-columns:1.3fr 1fr;}
  .card{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .card h3{font-size:13px;color:var(--text-dim);margin:0 0 6px 0;letter-spacing:0.06em;}
  .stat{font-family:'IBM Plex Mono';font-size:32px;font-weight:600;}
  .stat-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;font-weight:600;}
  .badge-good{background:var(--good-dim);color:var(--good);} .badge-warn{background:var(--warn-dim);color:var(--warn);} .badge-bad{background:var(--accent-dim);color:#FFAF9C;}
  .gauge-wrap{display:flex;align-items:center;gap:18px;} .gauge-num{font-family:'IBM Plex Mono';font-size:28px;font-weight:600;} .gauge-label{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .challenge{border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px;background:var(--bg-panel-2);}
  .challenge-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .challenge h4{margin:0 0 6px 0;font-size:15px;font-family:'Oswald';text-transform:none;letter-spacing:0;}
  .challenge p{margin:0;color:var(--text-dim);font-size:13px;line-height:1.5;}
  .points-pill{font-family:'IBM Plex Mono';background:var(--bg);border:1px solid var(--line);padding:4px 10px;border-radius:20px;font-size:12px;color:var(--accent);white-space:nowrap;}
  .challenge-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--text-dim);flex-wrap:wrap;gap:8px;}

  .rank-row.me{border-color:var(--accent);}
  .bib-num{font-family:'IBM Plex Mono';font-size:15px;width:34px;color:var(--text-dim);}

  .rank-name{flex:1;} .rank-name .n{font-weight:600;font-size:14px;} .rank-name .m{font-size:11px;color:var(--text-dim);}
  .rank-pts{font-family:'IBM Plex Mono';font-size:16px;color:var(--accent);width:70px;text-align:right;}
  .evo{font-size:11px;width:90px;text-align:right;color:var(--text-dim);} .evo.down{color:var(--good);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:10px;border-bottom:1px solid var(--line);} tr:last-child td{border-bottom:none;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px;width:100%;max-width:480px;max-height:88vh;overflow:auto;position:relative;}
  .modal h3{font-size:18px;font-family:'Oswald';text-transform:none;letter-spacing:0;margin-top:0;}
  .close-x{position:absolute;top:16px;right:18px;background:none;border:none;color:var(--text-dim);font-size:18px;}
  .keycode{font-family:'IBM Plex Mono';background:var(--bg);border:1px dashed var(--line);padding:8px 12px;border-radius:6px;display:inline-block;letter-spacing:0.05em;}
  .photo-thumb{width:100%;max-height:220px;object-fit:cover;border-radius:6px;margin-top:10px;border:1px solid var(--line);}

  .chat-messages{flex:1;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:14px;}
  .chat-msg{display:flex;gap:10px;max-width:78%;}
  .chat-msg.me{align-self:flex-end;flex-direction:row-reverse;}
  .chat-bubble{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
  .chat-msg.me .chat-bubble{background:var(--accent-dim);border-color:var(--accent);}
  .chat-meta{font-size:11px;color:var(--text-dim);margin-bottom:3px;display:flex;gap:6px;}
  .chat-msg.me .chat-meta{flex-direction:row-reverse;}
  .chat-text{font-size:14px;line-height:1.4;white-space:pre-wrap;word-break:break-word;}
  .chat-photo{max-width:240px;border-radius:8px;margin-top:6px;display:block;}
  .chat-input-row{display:flex;gap:8px;align-items:flex-end;padding-top:12px;border-top:1px solid var(--line);}

  .mention-box{display:none;flex-direction:column;position:absolute;bottom:100%;left:0;right:0;margin-bottom:6px;background:var(--bg-panel-2);border:1px solid var(--line);border-radius:8px;max-height:180px;overflow-y:auto;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,0.4);}
  .mention-suggestion{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:var(--text);padding:8px 10px;text-align:left;font-size:13px;cursor:pointer;}
  .mention-suggestion:hover{background:var(--bg-panel);}
  .emoji-box{display:none;position:absolute;bottom:100%;right:0;margin-bottom:6px;background:var(--bg-panel-2);border:1px solid var(--line);border-radius:8px;padding:8px;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,0.4);grid-template-columns:repeat(7,1fr);gap:2px;width:250px;}
  .emoji-box button{background:none;border:none;font-size:20px;padding:5px;border-radius:6px;cursor:pointer;}
  .emoji-box button:hover{background:var(--bg-panel);}
  .chat-attach-preview{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:6px 10px;background:var(--bg-panel-2);border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--text-dim);}
  .chat-attach-preview img{width:36px;height:36px;object-fit:cover;border-radius:6px;}
  .chat-del{background:none;border:none;color:var(--text-dim);font-size:11px;cursor:pointer;margin-top:4px;padding:0;}
  .feed-comments{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
  .feed-comment{display:flex;gap:8px;margin-bottom:10px;}
  .feed-comment .bubble{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;flex:1;}
  .feed-comment .meta{font-size:11px;color:var(--text-dim);display:flex;gap:6px;margin-bottom:2px;}
  .feed-comment .txt{font-size:13px;line-height:1.4;white-space:pre-wrap;word-break:break-word;}
  .feed-comment-input{display:flex;gap:8px;margin-top:6px;}
  .feed-comment-input input{flex:1;background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px;}
  .empty{color:var(--text-dim);font-size:13px;padding:20px 0;text-align:center;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;font-size:13px;z-index:99;}
  .toast-ok{background:var(--good-dim);color:var(--good);border:1px solid var(--good);}
  .toast-err{background:var(--accent-dim);color:#FFAF9C;border:1px solid var(--accent);}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .mobile-topbar{display:none;position:sticky;top:0;left:0;right:0;height:56px;background:var(--bg-panel);border-bottom:1px solid var(--line);align-items:center;padding:0 16px;z-index:30;gap:14px;}
  .mobile-topbar .hamburger{background:none;border:none;color:var(--text);font-size:22px;padding:4px 6px;}
  .mobile-topbar .mt-title{font-family:'Oswald';font-size:15px;letter-spacing:0.04em;}
  .mobile-topbar .mt-title .num{color:var(--accent);}
  .sidebar-close-mobile{display:none;}
  .sidebar-overlay{display:none;}
  @media(max-width:900px){
    .mobile-topbar{display:flex;}
    .shell{flex-direction:column;}
    .sidebar{
      position:fixed; top:0; left:0; height:100vh; width:250px; z-index:45;
      transform:translateX(-100%); transition:transform .25s ease; box-shadow:4px 0 24px rgba(0,0,0,0.5);
    }
    .sidebar.open{transform:translateX(0);}
    .side-brand{display:flex;}
    .side-foot{display:flex;flex-direction:column;} /* mantém as opções empilhadas, igual ao desktop */
    .sidebar-close-mobile{display:block;position:absolute;top:18px;right:16px;background:none;border:none;color:var(--text-dim);font-size:20px;}
    .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:40;display:none;}
    .sidebar-overlay.show{display:block;}
    .main{padding:20px;}
    .grid-3{grid-template-columns:1fr;} .grid-2{grid-template-columns:1fr;} .row2{grid-template-columns:1fr;}
  }
</style>
</head>

<div id="app"><div class="center-screen"><div style="color:var(--text-dim);font-size:13px;">Carregando…</div></div></div>

<script>
(function(){
/* ======================= CONFIG SUPABASE ======================= */
const SUPABASE_URL = 'https://mojcqxkenbvcljrtutsk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_j3-0wTnYTgFvxRtA54e-gA_UNu8oscb';
const EMAIL_DOMAIN = '@fmfit.local'; // usuário vira email fake internamente para o Supabase Auth

// Adaptador em memória (usado quando o participante NÃO marca "manter conectado",
// ou automaticamente quando localStorage não está disponível, como dentro do preview do chat).
const memoryStorage = (()=>{ const d={}; return {
  getItem:(k)=> (k in d? d[k] : null),
  setItem:(k,v)=>{ d[k]=v; },
  removeItem:(k)=>{ delete d[k]; }
};})();

function localStorageAvailable(){
  try{ window.localStorage.setItem('__fmfit_test__','1'); window.localStorage.removeItem('__fmfit_test__'); return true; }
  catch(e){ return false; }
}
const HAS_LOCAL_STORAGE = localStorageAvailable();

// Quando publicado como site (fora do preview do chat), "manter conectado" usa localStorage de verdade,
// então o login sobrevive a fechar a aba/o navegador. Sem isso, cai para memória (sessão some ao recarregar).
function makeClient(remember){
  const storage = (remember && HAS_LOCAL_STORAGE) ? window.localStorage : memoryStorage;
  return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { storage, persistSession: true, autoRefreshToken: true, detectSessionInUrl:false }
  });
}
let supabase = makeClient(true); // ao carregar a página, tenta recuperar sessão salva (se houver)

/* ======================= UTIL ======================= */
function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function calcIMC(peso,alturaCm){ const m=alturaCm/100; if(!peso||!m) return null; return +(peso/(m*m)).toFixed(1); }
function classIMC(imc){
  if(imc==null) return {label:'—',tone:'warn'};
  if(imc<18.5) return {label:'Abaixo do peso',tone:'warn'};
  if(imc<25) return {label:'Peso normal',tone:'good'};
  if(imc<30) return {label:'Sobrepeso',tone:'warn'};
  if(imc<35) return {label:'Obesidade I',tone:'bad'};
  if(imc<40) return {label:'Obesidade II',tone:'bad'};
  return {label:'Obesidade III',tone:'bad'};
}
function daysLeft(dateStr){ const d=new Date(dateStr+'T23:59:59'); return Math.ceil((d-new Date())/86400000); }
function fmtDate(dateStr){ if(!dateStr) return '—'; return new Date(dateStr+'T12:00:00').toLocaleDateString('pt-BR'); }
function fmtDateTime(ts){ if(!ts) return '—'; return new Date(ts).toLocaleDateString('pt-BR'); }

// Traduz mensagens de erro comuns do Supabase/Postgres para português.
function traduzirErro(msg){
  if(!msg) return 'Ocorreu um erro inesperado. Tente novamente.';
  const m = msg.toLowerCase();
  const mapa = [
    [/invalid login credentials/, 'Usuário ou senha inválidos.'],
    [/user already registered|already registered|already exists/, 'Esse usuário já existe.'],
    [/password should be at least/, 'A senha deve ter pelo menos 6 caracteres.'],
    [/email rate limit exceeded|too many requests/, 'Muitas tentativas seguidas. Aguarde um pouco e tente novamente.'],
    [/jwt expired|invalid jwt|session.*expired/, 'Sua sessão expirou. Faça login novamente.'],
    [/row-level security|permission denied|not authorized|não pode ser modificado/, 'Você não tem permissão para fazer isso.'],
    [/duplicate key value violates unique constraint/, 'Já existe um registro com esse valor.'],
    [/violates foreign key constraint/, 'Não é possível concluir: há dados vinculados a este registro.'],
    [/violates not-null constraint/, 'Preencha todos os campos obrigatórios.'],
    [/failed to fetch|networkerror|network request failed/, 'Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.'],
    [/user not found|não encontrado/, 'Usuário não encontrado.'],
    [/invalid email/, 'Usuário inválido.'],
  ];
  for(const [re,pt] of mapa){ if(re.test(m)) return pt; }
  return msg; // sem tradução mapeada: mostra a mensagem original do servidor
}
function initials(nome){ return (nome||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }
function avatarHTML(user,extraStyle){
  if(user && user.avatar_url) return `<div class="avatar" style="${extraStyle||''}padding:0;overflow:hidden;"><img src="${user.avatar_url}" style="width:100%;height:100%;object-fit:cover;" /></div>`;
  return `<div class="avatar" style="${extraStyle||''}">${initials(user?.nome)}</div>`;
}
function compressImageToBlob(file,maxW=480,quality=0.55){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width,h=img.height;
        if(w>maxW){ h=h*(maxW/w); w=maxW; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>resolve(blob),'image/jpeg',quality);
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}

/* ======================= STATE ======================= */
function novoLoginForm(){ return {username:(HAS_LOCAL_STORAGE && localStorage.getItem('fmfit_last_user'))||'', senha:'', lembrar:true}; }
function novoCadastroForm(){ return {chave:'',nome:'',username:'',senha:'',idade:'',sexo:'feminino',peso:'',altura:'',lembrar:true}; }

let state = {
  screen:'boot', // boot | login | cadastro | app | admin
  appTab:'dashboard', adminTab:'chaves',
  session:null, profile:null,
  sidebarOpen:false, canInstall:false, chatNaoLidas:0, feedNaoLidas:0, desafiosPendentes:0, rankingMudou:false,
  loginForm: novoLoginForm(), cadastroForm: novoCadastroForm(),
  authError:'', busy:false, modal:null, toast:null
};
function setState(patch){ state = {...state,...patch}; render(); }
// Atualiza um campo de formulário SEM re-renderizar (preserva o foco/cursor enquanto o usuário digita).
function onField(formKey,field,value){ state[formKey][field] = value; }
function togglePwd(inputId,btn){
  const el = document.getElementById(inputId);
  if(!el) return;

  else { el.type='password'; btn.textContent='👁'; }

/* ======================= BOOT / SESSION ======================= */
async function boot(){
  const { data:{session} } = await supabase.auth.getSession();
  if(session){
    const { data:profile } = await supabase.from('profiles').select('*').eq('id',session.user.id).single();
    if(profile && contaLiberada(profile)){ setState({session,profile,screen:'app',appTab:'dashboard'}); return; }
  configurarLembretes();
  iniciarRealtimeChat();
  iniciarRealtimeFeed();
  atualizarContadorNaoLidas();
  atualizarContadorFeedNaoLidas();
  atualizarContadorDesafios();
  atualizarStatusRanking();
  iniciarRealtimeRanking();
    if(profile && !contaLiberada(profile)){ await supabase.auth.signOut(); setState({screen:'login',authError:mensagemBloqueio(profile)}); return; }
  }
  setState({screen:'login'});
}

function contaLiberada(profile){
  if(profile.ativo === false) return false;
  if(profile.licenca_expira_em && profile.licenca_expira_em < new Date().toISOString().slice(0,10)) return false;
  return true;
}
function mensagemBloqueio(profile){
  if(profile.ativo === false) return 'Sua conta foi desativada pelo administrador.';
  return `Sua licença expirou em ${fmtDate(profile.licenca_expira_em)}. Contate o administrador para renovar.`;
}

/* ======================= AUTH ======================= */
async function handleLogin(username,senha,lembrar){
  setState({busy:true,authError:''});
  supabase = makeClient(lembrar);
  const email = username.trim().toLowerCase()+EMAIL_DOMAIN;
  const { data, error } = await supabase.auth.signInWithPassword({email,password:senha});
  if(error){ setState({busy:false,authError:'Usuário ou senha inválidos.'}); return; }
  const { data:profile } = await supabase.from('profiles').select('*').eq('id',data.user.id).single();
  if(!profile){ setState({busy:false,authError:'Conta sem perfil associado. Contate o administrador.'}); return; }
  if(!contaLiberada(profile)){ await supabase.auth.signOut(); setState({busy:false,authError:mensagemBloqueio(profile)}); return; }
  if(HAS_LOCAL_STORAGE) localStorage.setItem('fmfit_last_user',username.trim().toLowerCase());
  setState({busy:false,session:data.session,profile,screen:'app',appTab:'dashboard'});
  configurarLembretes();
  iniciarRealtimeChat();
  iniciarRealtimeFeed();
  atualizarContadorNaoLidas();
  atualizarContadorFeedNaoLidas();
  atualizarContadorDesafios();
  atualizarStatusRanking();
  iniciarRealtimeRanking();
}

async function handleCadastro(form){
  setState({busy:true,authError:''});
  supabase = makeClient(form.lembrar);
  const username = form.username.trim().toLowerCase();
  const email = username+EMAIL_DOMAIN;

  const { data: signData, error: signErr } = await supabase.auth.signUp({email,password:form.senha});
  if(signErr){
    const msg = traduzirErro(signErr.message);
    setState({busy:false,authError:msg}); return;
  }
  if(!signData.session){
    setState({busy:false,authError:'Cadastro criado, mas a confirmação de e-mail está ativa no projeto Supabase. Peça para desativar "Confirm email" em Authentication → Settings e tente novamente.'});
    return;
  }

  const { data:tipo, error:keyErr } = await supabase.rpc('redeem_access_key',{key_code:form.chave.trim()});
  if(keyErr){
    setState({busy:false,authError:keyErr.message ? traduzirErro(keyErr.message) : 'Chave de acesso inválida.'});
    return;
  }

  const peso = parseFloat(form.peso), altura = parseFloat(form.altura);
  const imc = calcIMC(peso,altura);
  const isAdmin = tipo==='admin';
  // Licença padrão de 30 dias para novos usuários (admins não expiram). O admin pode renovar depois na aba Usuários.
  const licencaExpiraEm = isAdmin ? null : new Date(Date.now()+30*86400000).toISOString().slice(0,10);
  const profile = {
    id: signData.user.id, username, nome: form.nome, idade: parseInt(form.idade,10), sexo: form.sexo,
    peso, peso_inicial: peso, altura, imc, pontos:0, is_admin: isAdmin, licenca_expira_em: licencaExpiraEm
  };
  const { error: profErr } = await supabase.from('profiles').insert(profile);
  if(profErr){ setState({busy:false,authError:'Erro ao criar perfil: '+traduzirErro(profErr.message)}); return; }
  await supabase.from('weight_history').insert({user_id:signData.user.id,peso});
  if(HAS_LOCAL_STORAGE) localStorage.setItem('fmfit_last_user',username);

  setState({busy:false,session:signData.session,profile,screen:'app',appTab:'dashboard'});
  configurarLembretes();
  iniciarRealtimeChat();
  iniciarRealtimeFeed();
  atualizarContadorNaoLidas();
  atualizarContadorFeedNaoLidas();
  atualizarContadorDesafios();
  atualizarStatusRanking();
  iniciarRealtimeRanking();
}

async function handleLogout(){
  await supabase.auth.signOut();
  supabase = makeClient(true);
  setState({session:null,profile:null,screen:'login',authError:'',loginForm:novoLoginForm(),cadastroForm:novoCadastroForm()});
}

async function loadAppTab(){
  if(state.appTab==='dashboard' || state.appTab==='ranking' || state.appTab==='chat' || state.appTab==='feed'){
    const { data:users } = await supabase.from('profiles').select('*').order('pontos',{ascending:false});

    cache.chatMessages = msgs||[];

    await marcarChatComoLido();

// Monta o card de um desafio, lidando com desafios de etapa única e de múltiplas etapas.
function challengeCardHTML(c,minhas){
  const etapas = c.etapas||1;
  const periodo = c.data_inicio===c.prazo ? `Válido só em ${fmtDate(c.prazo)}` : `Válido de ${fmtDate(c.data_inicio)} até ${fmtDate(c.prazo)}`;
  const pontosInfo = etapas>1 ? `+${c.pontos} pts × ${etapas} etapas` : `+${c.pontos} pts`;

  if(etapas<=1){
    const s = minhas.filter(x=>x.challenge_id===c.id).sort((a,b)=>b.data.localeCompare(a.data))[0];
    let statusBadge='';
    if(s){
      if(s.status==='aprovado') statusBadge = `<span class="badge badge-good">Aprovado ✓</span>`;
      else if(s.status==='rejeitado') statusBadge = `<span class="badge badge-bad">Rejeitado</span>`;
      else statusBadge = `<span class="badge badge-warn">Em análise</span>`;
    }
    return `
    <div class="challenge">
      <div class="challenge-top"><h4>${c.titulo}</h4><span class="points-pill">${pontosInfo}</span></div>
      <p>${c.descricao||''}</p>
      <div class="challenge-foot">
        <span>${periodo}</span>
        <div style="display:flex;gap:8px;align-items:center;">
          ${statusBadge}
          ${(!s||s.status==='rejeitado')?`<button class="btn btn-primary btn-small" onclick="openEnvioModal('${c.id}',1)">Enviar evidência</button>`:''}
        </div>
      </div>
    </div>`;
  }

  // Desafio com múltiplas etapas (ex: caminhar 4 dias)
  const perEtapa = [];
  for(let n=1;n<=etapas;n++){
    const s = minhas.filter(x=>x.challenge_id===c.id && x.etapa===n).sort((a,b)=>b.data.localeCompare(a.data))[0];
    perEtapa.push({n,s});
  }
  const concluidas = perEtapa.filter(e=>e.s && e.s.status==='aprovado').length;
  const proxima = perEtapa.find(e=>!e.s || e.s.status!=='aprovado');
  const dotColor = (e)=> !e.s ? 'var(--line)' : e.s.status==='aprovado' ? 'var(--good)' : e.s.status==='rejeitado' ? 'var(--accent)' : 'var(--warn)';
  const dots = perEtapa.map(e=>`<span title="Etapa ${e.n}" style="width:14px;height:14px;border-radius:50%;background:${dotColor(e)};display:inline-block;"></span>`).join('');

  return `
  <div class="challenge">
    <div class="challenge-top"><h4>${c.titulo}</h4><span class="points-pill">${pontosInfo}</span></div>
    <p>${c.descricao||''}</p>
    <div style="display:flex;gap:6px;margin:10px 0;">${dots}</div>
    <div class="challenge-foot">
      <span>${periodo} · ${concluidas}/${etapas} etapas concluídas</span>
      <div style="display:flex;gap:8px;align-items:center;">
        ${proxima
          ? (proxima.s && proxima.s.status==='pendente'
              ? `<span class="badge badge-warn">Etapa ${proxima.n} em análise</span>`
              : `<button class="btn btn-primary btn-small" onclick="openEnvioModal('${c.id}',${proxima.n})">${proxima.s&&proxima.s.status==='rejeitado'?`Reenviar etapa ${proxima.n}`:`Enviar etapa ${proxima.n} de ${etapas}`}</button>`)
          : `<span class="badge badge-good">Todas as etapas concluídas ✓</span>`}
      </div>
    </div>
  </div>`;
}
function openEnvioModal(challengeId,etapa){ setState({modal:{type:'envio',data:{challengeId,etapa:etapa||1}}}); }

/* ---- HISTÓRICO (desafios de dias passados: concluído ou perdido) ---- */
function tabHistorico(){
  const hoje = new Date().toISOString().slice(0,10);
  const passados = cache.challenges.filter(c=>c.prazo<hoje).sort((a,b)=>b.prazo.localeCompare(a.prazo));
  const minhas = cache.mySubmissions;
  function etapasAprovadas(c){
    const etapas = c.etapas||1; let count=0;
    for(let n=1;n<=etapas;n++){ if(minhas.some(x=>x.challenge_id===c.id && x.etapa===n && x.status==='aprovado')) count++; }
    return count;
  }
  const concluidos = passados.filter(c=>etapasAprovadas(c)===(c.etapas||1)).length;
  const perdidos = passados.length - concluidos;
  return `
  <div class="page-title"><h1>Histórico</h1></div>
  <div class="page-sub">Confira se você cumpriu ou perdeu algum desafio de dias anteriores.</div>
  <div class="grid grid-3" style="margin-bottom:18px;">
    <div class="card"><h3>Total de dias</h3><div class="stat">${passados.length}</div></div>
    <div class="card"><h3>Concluídos</h3><div class="stat" style="color:var(--good)">${concluidos}</div></div>
    <div class="card"><h3>Perdidos</h3><div class="stat" style="color:var(--accent)">${perdidos}</div></div>
  </div>
  <div class="card">
    ${passados.length? passados.map(c=>{
      const etapas = c.etapas||1;
      const feitas = etapasAprovadas(c);
      const badge = etapas>1
        ? (feitas===etapas ? `<span class="badge badge-good">${feitas}/${etapas} etapas ✓</span>` : `<span class="badge badge-bad">${feitas}/${etapas} etapas — perdeu ${etapas-feitas}</span>`)
        : (feitas===1 ? `<span class="badge badge-good">Concluído ✓</span>` : `<span class="badge badge-bad">Perdido</span>`);
      return `
      <div class="challenge-foot" style="padding:10px 0;border-bottom:1px solid var(--line);">
        <span>${fmtDate(c.prazo)} — ${c.titulo}</span>
        ${badge}
      </div>`;
    }).join('') : `<div class="empty">Ainda não há dias passados no seu histórico.</div>`}
  </div>`;
}

  const users = cache.users, me = state.profile.id;

  <div class="page-sub">Evolução de todos os participantes — cada um vê o progresso de todos.</div>

/* ---- FEED (evidências de todos, com reações) ---- */
const EMOJIS_REACAO = ['👍','🔥','💪','🎉','❤️','👏'];
let realtimeFeedAtivo = false;

function tabFeed(){
  const chById = Object.fromEntries(cache.challenges.map(c=>[c.id,c]));
  const userById = Object.fromEntries(cache.users.map(u=>[u.id,u]));
  const subs = cache.feedSubmissions;
  return `
  <div class="page-title"><h1>Feed</h1></div>
  <div class="page-sub">Evidências de todo mundo, em ordem — reaja com um emoji para incentivar.</div>
  ${subs.length? subs.map(s=>feedCardHTML(s,chById,userById)).join('') : `<div class="empty">Ainda não há evidências enviadas.</div>`}`;
}
function feedCardHTML(s,chById,userById){
  const c = chById[s.challenge_id];
  const u = userById[s.user_id];
  const reacoes = cache.feedReactions[s.id] || [];
  const contagem = {};
  const meusEmojis = new Set();
  reacoes.forEach(r=>{ contagem[r.emoji]=(contagem[r.emoji]||0)+1; if(r.user_id===state.profile.id) meusEmojis.add(r.emoji); });
  const quando = new Date(s.criado_em||s.data).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const statusBadge = s.status==='aprovado' ? `<span class="badge badge-good">Concluído ✓</span>` : s.status==='rejeitado' ? `<span class="badge badge-bad">Revogado</span>` : `<span class="badge badge-warn">Pendente</span>`;
  const comentarios = cache.feedComments[s.id] || [];
  return `
  <div class="card" style="margin-bottom:16px;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
      ${avatarHTML(u,'width:34px;height:34px;font-size:13px;')}
      <div style="flex:1;">
        <div style="font-weight:600;font-size:14px;">${u?u.nome:'—'}</div>
        <div class="helper">${quando} · ${c?c.titulo:'(desafio removido)'}${c&&(c.etapas||1)>1?` (Etapa ${s.etapa||1}/${c.etapas})`:''}</div>
      </div>
      ${statusBadge}
      ${state.profile.is_admin?`<button class="btn btn-ghost btn-small" style="width:auto;" title="Excluir esta evidência do feed" onclick="onExcluirSubmissao('${s.id}')">🗑️</button>`:''}
    </div>
    ${s.foto_url?`<img src="${s.foto_url}" class="photo-thumb" style="max-height:320px;" />`:''}
    ${s.comentario?`<p style="font-size:14px;margin-top:10px;">${escapeHTML(s.comentario)}</p>`:''}
    <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;">
      ${EMOJIS_REACAO.map(e=>`
        <button class="btn ${meusEmojis.has(e)?'btn-primary':'btn-ghost'} btn-small" style="width:auto;padding:5px 11px;" onclick="onReagirEvidencia('${s.id}','${e}')">${e}${contagem[e]?' '+contagem[e]:''}</button>
      `).join('')}
    </div>
    <div class="feed-comments">
      ${comentarios.map(cm=>{
        const cu = userById[cm.user_id];
        const hora = new Date(cm.criado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
        const podeExcluir = cm.user_id===state.profile.id || state.profile.is_admin;
        return `
        <div class="feed-comment">
          ${avatarHTML(cu,'width:24px;height:24px;font-size:10px;flex-shrink:0;')}
          <div class="bubble">
            <div class="meta"><b>${cu?cu.nome:'—'}</b><span>${hora}</span></div>
            <div class="txt">${destacarMencoes(cm.texto)}</div>
            ${podeExcluir?`<button class="chat-del" onclick="onExcluirComentarioFeed('${cm.id}','${s.id}')">Excluir</button>`:''}
          </div>
        </div>`;
      }).join('')}
      <div class="feed-comment-input">
        <input type="text" id="fc-input-${s.id}" placeholder="Escreva um comentário..." onkeydown="if(event.key==='Enter'){onEnviarComentarioFeed('${s.id}');}" />
        <button class="btn btn-ghost btn-small" style="width:auto;" onclick="onEnviarComentarioFeed('${s.id}')">Enviar</button>
      </div>
    </div>
  </div>`;
}
async function carregarComentariosFeed(subIds){
  cache.feedComments = {};
  if(!subIds.length) return;
  const { data } = await supabase.from('submission_comments').select('*').in('submission_id',subIds).order('criado_em',{ascending:true});
  (data||[]).forEach(cm=>{
    if(!cache.feedComments[cm.submission_id]) cache.feedComments[cm.submission_id]=[];
    cache.feedComments[cm.submission_id].push(cm);
  });
}
async function onEnviarComentarioFeed(subId){
  const el = document.getElementById('fc-input-'+subId);
  const texto = el ? el.value.trim() : '';
  if(!texto) return;
  const { error } = await supabase.from('submission_comments').insert({submission_id:subId,user_id:state.profile.id,texto});
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  if(el) el.value='';
  await carregarComentariosFeed(cache.feedSubmissions.map(s=>s.id));
  if(state.appTab==='feed') rerenderMain();
}
async function onExcluirComentarioFeed(commentId,subId){
  const { error } = await supabase.from('submission_comments').delete().eq('id',commentId);
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  await carregarComentariosFeed(cache.feedSubmissions.map(s=>s.id));
  if(state.appTab==='feed') rerenderMain();
}
async function carregarReacoesFeed(subIds){
  cache.feedReactions = {};
  if(!subIds.length) return;
  const { data } = await supabase.from('submission_reactions').select('*').in('submission_id',subIds);
  (data||[]).forEach(r=>{
    if(!cache.feedReactions[r.submission_id]) cache.feedReactions[r.submission_id]=[];
    cache.feedReactions[r.submission_id].push(r);
  });
}
async function onReagirEvidencia(subId,emoji){
  const jaTem = (cache.feedReactions[subId]||[]).some(r=>r.user_id===state.profile.id && r.emoji===emoji);
  if(jaTem){
    await supabase.from('submission_reactions').delete().eq('submission_id',subId).eq('user_id',state.profile.id).eq('emoji',emoji);
  } else {
    const { error } = await supabase.from('submission_reactions').insert({submission_id:subId,user_id:state.profile.id,emoji});
    if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  }
  await carregarReacoesFeed(cache.feedSubmissions.map(s=>s.id));
  if(state.appTab==='feed') rerenderMain();
}
function iniciarRealtimeFeed(){
  if(realtimeFeedAtivo) return;
  realtimeFeedAtivo = true;
  function estouNoFeed(){ return state.screen==='app' && state.appTab==='feed'; }
  supabase.channel('feed_realtime')
    .on('postgres_changes', {event:'*', schema:'public', table:'submissions'}, (payload)=>{
      if(payload.eventType!=='INSERT') return;
      if(cache.feedSubmissions.some(s=>s.id===payload.new.id)) return;
      cache.feedSubmissions.unshift(payload.new);
      const souEu = payload.new.user_id===state.profile.id;
      if(estouNoFeed()){ rerenderMain(); }
      else if(!souEu){ state.feedNaoLidas = (state.feedNaoLidas||0)+1; render(); }
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'submission_reactions'}, async (payload)=>{
      await carregarReacoesFeed(cache.feedSubmissions.map(s=>s.id));
      if(estouNoFeed()){ rerenderMain(); return; }
      if(payload.eventType==='INSERT'){
        const souEu = payload.new.user_id===state.profile.id;
        if(!souEu){ state.feedNaoLidas = (state.feedNaoLidas||0)+1; render(); }
      }
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'submission_comments'}, async (payload)=>{
      await carregarComentariosFeed(cache.feedSubmissions.map(s=>s.id));
      if(estouNoFeed()) rerenderMain();
      const novoComentario = payload.eventType==='INSERT' ? payload.new : null;
      const souEu = novoComentario && novoComentario.user_id===state.profile.id;
      if(novoComentario && !souEu && !estouNoFeed()){
        state.feedNaoLidas = (state.feedNaoLidas||0)+1; render();
        showToast('💬 Novo comentário em uma evidência do feed');
      }
    })
    .subscribe();
}

      <div class="field"><label>Confirmar nova senha</label><div class="pwd-wrap"><input id="pf-confirma-senha" type="password" autocomplete="new-password" /><button type="button" class="pwd-toggle" onclick="togglePwd('pf-confirma-senha',this)">👁</button></div></div>

async function onSalvarPerfil(){
  const nome = document.getElementById('pf-nome').value;
  const idade = parseInt(document.getElementById('pf-idade').value,10);
  const sexo = document.getElementById('pf-sexo').value;
  const altura = parseFloat(document.getElementById('pf-altura').value);
  if(!nome||!idade||!altura){ showToast('Preencha todos os campos.',false); return; }
  const imc = calcIMC(state.profile.peso, altura);
  const { error } = await supabase.from('profiles').update({nome,idade,sexo,altura,imc}).eq('id',state.profile.id);
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  await refreshProfile();
  setState({editandoPerfil:false});
  showToast('Perfil atualizado.');
}
async function onAvatarSelecionado(ev){
  const file = ev.target.files[0]; if(!file) return;
  showToast('Enviando foto…');
  try{
    const blob = await compressImageToBlob(file, 320, 0.7);
    const path = `${state.profile.id}/avatar.jpg`;
    const { error: upErr } = await supabase.storage.from('avatars').upload(path, blob, {contentType:'image/jpeg', upsert:true});
    if(upErr){ showToast('Erro ao enviar foto: '+traduzirErro(upErr.message),false); return; }
    const { data: pub } = supabase.storage.from('avatars').getPublicUrl(path);
    const avatarUrl = pub.publicUrl + '?t=' + Date.now(); // evita cache antigo do navegador
    const { error: updErr } = await supabase.from('profiles').update({avatar_url:avatarUrl}).eq('id',state.profile.id);
    if(updErr){ showToast('Erro ao salvar foto: '+traduzirErro(updErr.message),false); return; }
    await refreshProfile();
    showToast('Foto de perfil atualizada.');
  }catch(e){ showToast('Não foi possível processar a imagem.',false); }
}
async function onAtualizarPeso(){
  const novoPeso = parseFloat(document.getElementById('p-novo-peso').value);
  if(!novoPeso||novoPeso<=0) return;
  const u = state.profile;
  const imc = calcIMC(novoPeso,u.altura);
  await supabase.from('profiles').update({peso:novoPeso,imc}).eq('id',u.id);
  await supabase.from('weight_history').insert({user_id:u.id,peso:novoPeso});
  await refreshProfile();
  await loadAppTab(); // recarrega o histórico de peso exibido
  showToast('Peso atualizado com sucesso.');
}
async function onAlterarSenha(){
  const nova = document.getElementById('pf-nova-senha').value;
  const confirma = document.getElementById('pf-confirma-senha').value;
  if(!nova || nova.length<6){ showToast('A senha deve ter ao menos 6 caracteres.',false); return; }
  if(nova!==confirma){ showToast('As senhas não coincidem.',false); return; }
  const { error } = await supabase.auth.updateUser({password:nova});
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  document.getElementById('pf-nova-senha').value='';
  document.getElementById('pf-confirma-senha').value='';
  showToast('Senha alterada com sucesso.');
}

let chatFotoPendente = null;
let realtimeChatAtivo = false;

function tabChat(){
  const userById = Object.fromEntries(cache.users.map(u=>[u.id,u]));
  const me = state.profile.id;
  const msgsHTML = cache.chatMessages.map(m=>{
    const u = userById[m.user_id];

    return `
    <div class="chat-msg ${isMe?'me':''}">
      ${avatarHTML(u,'width:32px;height:32px;font-size:12px;flex-shrink:0;')}
      <div>

        <div class="chat-bubble">

        </div>
        ${(isMe||state.profile.is_admin)?`<button class="chat-del" onclick="onExcluirMensagem('${m.id}')">Excluir</button>`:''}
      </div>
    </div>`;
  }).join('');
  return `
  <div class="page-title"><h1>Chat do grupo</h1></div>
  <div class="page-sub">Converse com os outros participantes — texto, foto ou foto com legenda.</div>
  <div class="chat-wrap">
    <div class="chat-messages" id="chat-scroll">${msgsHTML || '<div class="empty">Nenhuma mensagem ainda. Diga oi! 👋</div>'}</div>
    <div id="chat-preview-area"></div>
    <div class="chat-input-row">
      <label class="btn btn-ghost btn-small" style="width:auto;cursor:pointer;" title="Tirar foto">📷<input type="file" id="chat-foto-camera" accept="image/*" capture="environment" onchange="onChatFotoSelecionada(event)" style="display:none;" /></label>
      <label class="btn btn-ghost btn-small" style="width:auto;cursor:pointer;" title="Escolher da galeria">🖼️<input type="file" id="chat-foto-galeria" accept="image/*" onchange="onChatFotoSelecionada(event)" style="display:none;" /></label>
      <div class="chat-text-wrap">
        <div id="chat-mention-box" class="mention-box"></div>
        <div id="chat-emoji-box" class="emoji-box"></div>
        <textarea id="chat-texto" rows="1" placeholder="Escreva uma mensagem... digite @ para marcar alguém" oninput="onChatTextoInput(event)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();onEnviarMensagemChat();} else if(event.key==='Escape'){onFecharSugestoesMencao();}"></textarea>
      </div>
      <button class="btn btn-ghost btn-small" style="width:auto;" title="Emojis" onclick="onAbrirEmojis()">😊</button>
      <button class="btn btn-primary btn-small" onclick="onEnviarMensagemChat()">Enviar</button>
    </div>
  </div>`;
}
function escapeHTML(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function destacarMencoes(texto){
  const usernames = new Set(cache.users.map(u=>u.username.toLowerCase()));
  return escapeHTML(texto).replace(/@([a-zA-Z0-9_.]+)/g, (match,uname)=>{
    return usernames.has(uname.toLowerCase()) ? `<span style="color:var(--accent);font-weight:600;">@${uname}</span>` : match;
  });
}
function onChatTextoInput(ev){
  const el = ev.target;
  const pos = el.selectionStart;
  const antesCursor = el.value.slice(0,pos);
  const match = antesCursor.match(/@([a-zA-Z0-9_.]*)$/);
  const box = document.getElementById('chat-mention-box');
  if(!box) return;
  if(match){
    const termo = match[1].toLowerCase();
    const sugestoes = cache.users.filter(u=>u.id!==state.profile.id && u.username.toLowerCase().startsWith(termo)).slice(0,6);
    if(sugestoes.length){
      box.innerHTML = sugestoes.map(u=>`
        <button type="button" class="mention-suggestion" onmousedown="event.preventDefault();onSelecionarMencaoInline('${u.username}')">
          ${avatarHTML(u,'width:22px;height:22px;font-size:10px;')} <span>@${u.username}</span><span style="color:var(--text-dim);">${u.nome}</span>
        </button>`).join('');
      box.style.display='flex';
      return;
    }
  }
  box.style.display='none'; box.innerHTML='';
}
function onSelecionarMencaoInline(username){
  const el = document.getElementById('chat-texto');
  if(!el) return;
  const pos = el.selectionStart;
  const antes = el.value.slice(0,pos).replace(/@([a-zA-Z0-9_.]*)$/, '@'+username+' ');
  const depois = el.value.slice(pos);
  el.value = antes + depois;
  el.focus();
  el.setSelectionRange(antes.length, antes.length);
  onFecharSugestoesMencao();
}
function onFecharSugestoesMencao(){
  const box = document.getElementById('chat-mention-box');
  if(box){ box.style.display='none'; box.innerHTML=''; }
}
const EMOJIS_CHAT = ['💪','🔥','🏆','🥇','🎉','👏','😀','😅','😂','😢','😴','🥵','💧','🥗','🍎','🏃','🚶','🧘','⏱️','✅','❌','👍','👎','❤️','🙌','💯','🤝','😎','🤩','😭','🤔','🫡'];
function onAbrirEmojis(){
  const box = document.getElementById('chat-emoji-box');
  if(!box) return;
  if(box.style.display==='grid'){ box.style.display='none'; box.innerHTML=''; return; }
  box.innerHTML = EMOJIS_CHAT.map(e=>`<button type="button" onmousedown="event.preventDefault();onInserirEmoji('${e}')">${e}</button>`).join('');
  box.style.display='grid';
}
function onInserirEmoji(emoji){
  const el = document.getElementById('chat-texto');
  if(!el) return;
  const pos = el.selectionStart;
  el.value = el.value.slice(0,pos) + emoji + el.value.slice(pos);
  const novaPos = pos + emoji.length;
  el.focus();
  el.setSelectionRange(novaPos,novaPos);
}
function scrollChatParaFinal(){
  const el = document.getElementById('chat-scroll');
  if(el) el.scrollTop = el.scrollHeight;
}
async function onChatFotoSelecionada(ev){
  const file = ev.target.files[0]; if(!file) return;
  chatFotoPendente = await compressImageToBlob(file, 480, 0.6);
  const area = document.getElementById('chat-preview-area');
  if(area){
    area.innerHTML = `<div class="chat-attach-preview"><img src="${URL.createObjectURL(chatFotoPendente)}" /> Foto anexada — escreva uma legenda (opcional) e envie. <button class="link-btn" onclick="onRemoverFotoChat()">remover</button></div>`;
  }
}
function onRemoverFotoChat(){
  chatFotoPendente = null;
  const area = document.getElementById('chat-preview-area');
  if(area) area.innerHTML='';
}
async function onEnviarMensagemChat(){
  const textoEl = document.getElementById('chat-texto');
  const texto = textoEl ? textoEl.value.trim() : '';
  if(!texto && !chatFotoPendente) return;
  let fotoUrl = null;
  if(chatFotoPendente){
    const path = `${state.profile.id}/${Date.now()}.jpg`;
    const { error: upErr } = await supabase.storage.from('chat').upload(path, chatFotoPendente, {contentType:'image/jpeg'});
    if(upErr){ showToast('Erro ao enviar foto: '+traduzirErro(upErr.message),false); return; }
    const { data: pub } = supabase.storage.from('chat').getPublicUrl(path);
    fotoUrl = pub.publicUrl;
  }
  const { error } = await supabase.from('chat_messages').insert({user_id:state.profile.id, texto: texto||null, foto_url: fotoUrl});
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  chatFotoPendente = null;
  if(textoEl) textoEl.value='';
  const area = document.getElementById('chat-preview-area'); if(area) area.innerHTML='';
  // a mensagem própria também chega pelo realtime; recarrega para garantir consistência
  await loadAppTab();
}
async function onExcluirMensagem(id){
  const { error } = await supabase.from('chat_messages').delete().eq('id',id);
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  cache.chatMessages = cache.chatMessages.filter(m=>m.id!==id);
  if(state.appTab==='chat') rerenderMain();
}
function mencionaUsuario(texto,username){
  if(!texto||!username) return false;
  const escapado = username.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return new RegExp('@'+escapado+'\\b','i').test(texto);
}
function iniciarRealtimeChat(){
  if(realtimeChatAtivo) return;
  realtimeChatAtivo = true;
  supabase.channel('chat_messages_realtime')
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'chat_messages'}, (payload)=>{
      if(cache.chatMessages.some(m=>m.id===payload.new.id)) return;
      cache.chatMessages.push(payload.new);
      const souEu = payload.new.user_id===state.profile.id;
      const emChat = state.screen==='app' && state.appTab==='chat';
      const meMencionou = !souEu && mencionaUsuario(payload.new.texto, state.profile.username);

      if(emChat){
        rerenderMain(); scrollChatParaFinal();
        if(!souEu) marcarChatComoLido();
      } else if(!souEu){
        state.chatNaoLidas = (state.chatNaoLidas||0)+1;
        render();
      }
      if(meMencionou){
        showToast('📣 Você foi mencionado no chat!');
        mostrarNotificacao('FM Fitness — você foi mencionado', payload.new.texto || 'Veja a mensagem no chat.');
      } else if(!souEu && !emChat){
        showToast('Nova mensagem no chat 💬');
      }
    })
    .subscribe();
}
async function marcarChatComoLido(){
  const agora = new Date().toISOString();
  state.chatNaoLidas = 0;
  if(state.profile) state.profile.chat_ultima_leitura = agora;
  await supabase.from('profiles').update({chat_ultima_leitura:agora}).eq('id',state.profile.id);
}
async function atualizarContadorNaoLidas(){
  if(!state.profile) return;
  const { count } = await supabase.from('chat_messages').select('id',{count:'exact',head:true})
    .gt('criado_em', state.profile.chat_ultima_leitura || '1970-01-01')
    .neq('user_id', state.profile.id);
  state.chatNaoLidas = count||0;
  render();
}

async function marcarFeedComoLido(){
  if(!state.profile) return;
  const agora = new Date().toISOString();
  state.feedNaoLidas = 0;
  state.profile.feed_ultima_leitura = agora;
  await supabase.from('profiles').update({feed_ultima_leitura:agora}).eq('id',state.profile.id);
}
async function atualizarContadorFeedNaoLidas(){
  if(!state.profile) return;
  const desde = state.profile.feed_ultima_leitura || '1970-01-01';
  const [subsRes, reacoesRes, comentariosRes] = await Promise.all([
    supabase.from('submissions').select('id',{count:'exact',head:true}).gt('criado_em',desde).neq('user_id',state.profile.id),
    supabase.from('submission_reactions').select('id',{count:'exact',head:true}).gt('criado_em',desde).neq('user_id',state.profile.id),
    supabase.from('submission_comments').select('id',{count:'exact',head:true}).gt('criado_em',desde).neq('user_id',state.profile.id),
  ]);
  state.feedNaoLidas = (subsRes.count||0)+(reacoesRes.count||0)+(comentariosRes.count||0);
  render();
}

async function onFotoSelecionada(ev){

  fotoPendente = await compressImageToBlob(file);

  img.src = URL.createObjectURL(fotoPendente); img.style.display='block';

async function onEnviarEvidencia(challengeId,etapa){
  const btn = document.getElementById('m-enviar-btn'); if(btn){ btn.disabled=true; btn.textContent='Enviando…'; }
  const comentario = document.getElementById('m-comentario').value;
  let fotoUrl = null;
  if(fotoPendente){
    const path = `${state.profile.id}/${Date.now()}.jpg`;
    const { error: upErr } = await supabase.storage.from('evidencias').upload(path,fotoPendente,{contentType:'image/jpeg'});
    if(upErr){ showToast('Erro ao enviar foto: '+traduzirErro(upErr.message),false); if(btn){btn.disabled=false;btn.textContent='Enviar evidência';} return; }
    const { data: pub } = supabase.storage.from('evidencias').getPublicUrl(path);
    fotoUrl = pub.publicUrl;
  }
  const { error: insErr } = await supabase.from('submissions').insert({user_id:state.profile.id,challenge_id:challengeId,foto_url:fotoUrl,comentario,etapa:etapa||1,status:'aprovado'});
  if(insErr){ showToast('Erro ao registrar evidência: '+traduzirErro(insErr.message),false); if(btn){btn.disabled=false;btn.textContent='Enviar evidência';} return; }
  fotoPendente = null;
  setState({modal:null});
  showToast('Evidência registrada e pontos creditados! ✓');
  loadAppTab();
  atualizarContadorDesafios();
}

function screenAdmin(){
  let content = `<div class="empty">Carregando…</div>`;
  const html = `<div class="shell">${sidebarHTML(state.adminTab,true)}<div class="main">${content}</div></div>`;
  setTimeout(loadAdminData,0);
  return html;
}
let adminCache = {keys:[],users:[],challenges:[],submissions:[]};
async function loadAdminData(){
  const [{data:keys},{data:users},{data:chs},{data:subs}] = await Promise.all([
    supabase.from('access_keys').select('*').order('criado_em',{ascending:false}),
    supabase.from('profiles').select('*').order('nome',{ascending:true}),
    supabase.from('challenges').select('*').order('prazo',{ascending:true}),
    supabase.from('submissions').select('*').order('data',{ascending:false})
  ]);
  adminCache = {keys:keys||[],users:users||[],challenges:chs||[],submissions:subs||[]};
  rerenderMain();
}

function adminChaves(){
  const keys = adminCache.keys;
  return `
  <div class="page-title"><h1>Chaves de acesso</h1><button class="btn btn-primary btn-small" onclick="setState({modal:{type:'novaChave'}})">+ Gerar chave</button></div>
  <div class="page-sub">Controle de login: gere chaves com prazo de expiração para novos cadastros.</div>
  <div class="card"><table>
    <tr><th>Chave</th><th>Tipo</th><th>Expira em</th><th>Status</th><th>Usada por</th><th></th></tr>
    ${keys.length? keys.map(k=>{
      const expirada = new Date(k.expira_em+'T23:59:59') < new Date();
      const uUsou = adminCache.users.find(u=>u.id===k.usado_por);
      const status = k.usado?`<span class="badge badge-good">Usada</span>`:expirada?`<span class="badge badge-bad">Expirada</span>`:`<span class="badge badge-warn">Ativa</span>`;
      return `<tr><td class="mono">${k.code}</td><td style="text-transform:capitalize">${k.tipo}</td><td>${fmtDate(k.expira_em)}</td><td>${status}</td><td>${uUsou?'@'+uUsou.username:'—'}</td><td><button class="btn btn-ghost btn-small" onclick="onExcluirChave('${k.code}')">Excluir</button></td></tr>`;
    }).join('') : `<tr><td colspan="6" class="empty">Nenhuma chave gerada ainda.</td></tr>`}
  </table></div>`;
}
async function onExcluirChave(code){
  const { error } = await supabase.from('access_keys').delete().eq('code',code);
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  showToast('Chave excluída.');
  loadAdminData();
}
async function onGerarChave(){
  const tipo = document.getElementById('k-tipo').value;
  const dias = parseInt(document.getElementById('k-dias').value,10)||7;
  const { data, error } = await supabase.rpc('generate_access_key',{tipo,dias});
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  setState({modal:null});
  showToast('Chave gerada: '+data);
  loadAdminData();
}

function adminDesafios(){
  const chs = adminCache.challenges;
  return `
  <div class="page-title"><h1>Desafios</h1><button class="btn btn-primary btn-small" onclick="setState({modal:{type:'novoDesafio'}})">+ Novo desafio</button></div>
  <div class="page-sub">Crie e gerencie os objetivos que valem pontos no ranking. Use "Editar" para mudar o período ou o número de etapas.</div>
  ${chs.length? chs.map(c=>{
    const periodo = c.data_inicio===c.prazo ? fmtDate(c.prazo) : `${fmtDate(c.data_inicio)} até ${fmtDate(c.prazo)}`;
    const etapas = c.etapas||1;
    const pontosInfo = etapas>1 ? `+${c.pontos} pts × ${etapas} etapas = ${c.pontos*etapas} pts` : `+${c.pontos} pts`;
    return `
    <div class="challenge"><div class="challenge-top"><h4>${c.titulo}</h4><span class="points-pill">${pontosInfo}</span></div>
      <p>${c.descricao||''}</p>
      <div class="challenge-foot"><span>Aparece: ${periodo}${etapas>1?` · ${etapas} etapas`:''}</span>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost btn-small" onclick='setState({modal:{type:"editarDesafio",data:${JSON.stringify(c).replace(/'/g,"&#39;")}}})'>Editar</button>
          <button class="btn btn-ghost btn-small" onclick="onExcluirDesafio('${c.id}')">Excluir</button>
        </div>
      </div>
    </div>`;
  }).join('') : `<div class="empty">Nenhum desafio criado ainda.</div>`}`;
}
async function onCriarDesafio(){
  const titulo=document.getElementById('d-titulo').value, descricao=document.getElementById('d-desc').value;
  const pontos=parseInt(document.getElementById('d-pontos').value,10)||10;
  const etapas=parseInt(document.getElementById('d-etapas').value,10)||1;
  const dataInicio=document.getElementById('d-inicio').value, prazo=document.getElementById('d-prazo').value;
  if(!titulo||!prazo||!dataInicio){ showToast('Preencha título, início e prazo.',false); return; }
  if(dataInicio>prazo){ showToast('A data de início não pode ser depois do prazo final.',false); return; }
  const { error } = await supabase.from('challenges').insert({titulo,descricao,pontos,etapas,data_inicio:dataInicio,prazo,criado_por:state.profile.id});
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  setState({modal:null}); showToast('Desafio criado.'); loadAdminData();
}
async function onSalvarEdicaoDesafio(id){
  const titulo=document.getElementById('e-titulo').value, descricao=document.getElementById('e-desc').value;
  const pontos=parseInt(document.getElementById('e-pontos').value,10)||10;
  const etapas=parseInt(document.getElementById('e-etapas').value,10)||1;
  const dataInicio=document.getElementById('e-inicio').value, prazo=document.getElementById('e-prazo').value;
  if(!titulo||!prazo||!dataInicio){ showToast('Preencha título, início e prazo.',false); return; }
  if(dataInicio>prazo){ showToast('A data de início não pode ser depois do prazo final.',false); return; }
  const { error } = await supabase.from('challenges').update({titulo,descricao,pontos,etapas,data_inicio:dataInicio,prazo}).eq('id',id);
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  setState({modal:null}); showToast('Desafio atualizado — o período de exibição foi ajustado.'); loadAdminData();
}
async function onExcluirDesafio(id){
  const { error } = await supabase.from('challenges').delete().eq('id',id);
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  showToast('Desafio removido.'); loadAdminData();
}

function adminUsuarios(){
  const users = adminCache.users;
  const hoje = new Date().toISOString().slice(0,10);
  return `
  <div class="page-title"><h1>Usuários</h1></div>
  <div class="page-sub">Administração de contas, pontuação, permissões e licença de acesso.</div>
  <div class="card"><table>
    <tr><th>Nome</th><th>Usuário</th><th>IMC</th><th>Peso</th><th>Pontos</th><th>Admin</th><th>Status</th><th></th></tr>
    ${users.length? users.map(u=>{
      const expirada = u.licenca_expira_em && u.licenca_expira_em<hoje;
      let status;
      if(u.ativo===false) status = `<span class="badge badge-bad">Desativado</span>`;
      else if(expirada) status = `<span class="badge badge-bad">Licença expirada em ${fmtDate(u.licenca_expira_em)}</span>`;
      else if(u.licenca_expira_em) status = `<span class="badge badge-good">Licença até ${fmtDate(u.licenca_expira_em)}</span>`;
      else status = `<span class="badge badge-good">Ativo (sem limite)</span>`;
      return `
      <tr><td>${u.nome}</td><td class="mono">@${u.username}</td><td>${u.imc}</td><td>${u.peso}kg</td>
        <td class="mono">${u.pontos}</td><td>${u.is_admin?'<span class="badge badge-good">Sim</span>':'—'}</td>
        <td>${status}</td>
        <td style="display:flex;gap:6px;flex-wrap:wrap;">
          ${u.ativo===false
            ? `<button class="btn btn-ghost btn-small" onclick="onReativarUsuario('${u.id}')">Reativar</button>`
            : `<button class="btn btn-ghost btn-small" onclick="onDesativarUsuario('${u.id}')">Desativar</button>`}
          <button class="btn btn-ghost btn-small" onclick="setState({modal:{type:'renovarLicenca',data:{userId:'${u.id}',nome:'${u.nome.replace(/'/g,"\\'")}'}}})">Renovar licença</button>
          <button class="btn btn-ghost btn-small" onclick="setState({modal:{type:'redefinirSenha',data:{username:'${u.username}',nome:'${u.nome.replace(/'/g,"\\'")}'}}})">Redefinir senha</button>
          <button class="btn btn-ghost btn-small" onclick="onRemoverUsuario('${u.id}')">Remover</button>
        </td></tr>`;
    }).join('') : `<tr><td colspan="8" class="empty">Nenhum usuário cadastrado.</td></tr>`}
  </table></div>
  <div class="info-box">"Desativar/Reativar" bloqueia ou libera o login na hora. "Renovar licença" define até quando o acesso vale — use quando a licença expirar (ou antes, para estender). "Remover" apaga o perfil do app; a conta de login original só pode ser totalmente apagada no painel do Supabase (Authentication → Users).</div>`;
}
async function onDesativarUsuario(userId){
  const { error } = await supabase.from('profiles').update({ativo:false}).eq('id',userId);
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  showToast('Usuário desativado.'); loadAdminData();
}
async function onReativarUsuario(userId){
  const { error } = await supabase.from('profiles').update({ativo:true}).eq('id',userId);
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  showToast('Usuário reativado.'); loadAdminData();
}
async function onRenovarLicenca(userId,dias){
  const licencaExpiraEm = dias==='ilimitada' ? null : new Date(Date.now()+parseInt(dias,10)*86400000).toISOString().slice(0,10);
  const { error } = await supabase.from('profiles').update({licenca_expira_em:licencaExpiraEm,ativo:true}).eq('id',userId);
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  setState({modal:null});
  showToast('Licença renovada.');
  loadAdminData();
}
async function onRedefinirSenha(username){
  const novaSenha = document.getElementById('rs-senha').value;
  if(!novaSenha || novaSenha.length<6){ showToast('A senha deve ter ao menos 6 caracteres.',false); return; }
  const { error } = await supabase.rpc('admin_reset_password',{target_username:username,new_password:novaSenha});
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  setState({modal:null});
  showToast('Senha redefinida com sucesso.');
}
async function onRemoverUsuario(id){
  if(id===state.profile.id){ showToast('Você não pode remover sua própria conta.',false); return; }
  const { error } = await supabase.from('profiles').delete().eq('id',id);
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  showToast('Usuário removido.'); loadAdminData();
}

function adminSubmissoes(){
  const subs = adminCache.submissions;
  const chById = Object.fromEntries(adminCache.challenges.map(c=>[c.id,c]));
  const userById = Object.fromEntries(adminCache.users.map(u=>[u.id,u]));
  return `
  <div class="page-title"><h1>Evidências enviadas</h1></div>
  <div class="page-sub">Evidências já são aprovadas automaticamente ao serem enviadas. Use esta tela só para revogar em caso de fraude ou engano.</div>
  ${subs.length? subs.map(s=>{
    const c = chById[s.challenge_id], u = userById[s.user_id];
    return `
    <div class="card" style="margin-bottom:14px;">
      <div class="challenge-top"><h4 style="margin:0;">@${u?u.username:'?'} — ${c?c.titulo:'(desafio removido)'}${c&&(c.etapas||1)>1?` (Etapa ${s.etapa||1}/${c.etapas})`:''}</h4>
        ${s.status==='pendente'?`<span class="badge badge-warn">Pendente</span>`:s.status==='aprovado'?`<span class="badge badge-good">Aprovado</span>`:`<span class="badge badge-bad">Revogado</span>`}
      </div>
      <div class="helper">${fmtDate(s.data)}${c?` · vale ${c.pontos} pts`:''}</div>
      ${s.comentario?`<p style="font-size:13px;color:var(--text-dim);margin-top:8px;">"${s.comentario}"</p>`:''}
      ${s.foto_url ? `<img src="${s.foto_url}" class="photo-thumb" />` : `<div class="helper" style="margin-top:8px;">Sem foto anexada.</div>`}
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
        ${s.status==='aprovado'?`<button class="btn btn-ghost btn-small" onclick="setState({modal:{type:'rejeitar',data:{subId:'${s.id}'}}})">Revogar (desconta pontos)</button>`:''}
        ${s.status==='rejeitado'?`<button class="btn btn-primary btn-small" onclick="onAprovarSubmissao('${s.id}')">Aprovar novamente</button>`:''}
        ${s.status==='pendente'?`<button class="btn btn-primary btn-small" onclick="onAprovarSubmissao('${s.id}')">Aprovar</button><button class="btn btn-ghost btn-small" onclick="setState({modal:{type:'rejeitar',data:{subId:'${s.id}'}}})">Rejeitar</button>`:''}
        <button class="btn btn-ghost btn-small" onclick="onExcluirSubmissao('${s.id}')">Excluir</button>
      </div>
    </div>`;
  }).join('') : `<div class="empty">Nenhuma evidência enviada ainda.</div>`}`;
}
async function onExcluirSubmissao(subId){
  if(!window.confirm('Excluir esta evidência permanentemente? Se ela já estava aprovada, os pontos serão descontados.')) return;
  const { error } = await supabase.rpc('admin_delete_submission',{sub_id:subId});
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  showToast('Evidência excluída.');
  cache.feedSubmissions = cache.feedSubmissions.filter(s=>s.id!==subId);
  delete cache.feedReactions[subId];
  delete cache.feedComments[subId];
  if(state.screen==='admin') loadAdminData();
  else if(state.screen==='app' && state.appTab==='feed') rerenderMain();
}
async function onAprovarSubmissao(subId){
  const { error } = await supabase.rpc('approve_submission',{sub_id:subId});
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  showToast('Evidência aprovada e pontos creditados.'); loadAdminData();
}
async function onConfirmarRejeicao(subId){
  const motivo = document.getElementById('r-motivo').value;
  const { error } = await supabase.rpc('reject_submission',{sub_id:subId,motivo});
  if(error){ showToast('Erro: '+traduzirErro(error.message),false); return; }
  setState({modal:null}); showToast('Evidência rejeitada.'); loadAdminData();
}

/* ======================= LEMBRETES (check-in do desafio do dia) ======================= */
let lembreteIntervalId = null;
function mostrarNotificacao(titulo,corpo){
  try{
    if('serviceWorker' in navigator && navigator.serviceWorker.controller){
      navigator.serviceWorker.ready.then(reg=>reg.showNotification(titulo,{body:corpo, icon:'./icon-192.png', badge:'./icon-192.png'}));
    } else if('Notification' in window && Notification.permission==='granted'){
      new Notification(titulo,{body:corpo, icon:'./icon-192.png'});
    }
  }catch(e){ console.warn('notificação falhou',e); }
}
/* ======================= RANKING: aviso de mudança de posição ======================= */
let realtimeRankingAtivo = false;
async function calcularMinhaPosicao(){
  const { data } = await supabase.from('profiles').select('id,pontos').order('pontos',{ascending:false});
  if(!data) return null;
  const idx = data.findIndex(u=>u.id===state.profile.id);
  return idx>=0 ? idx+1 : null;
}
async function atualizarStatusRanking(){
  if(!state.profile) return;
  const posicaoAtual = await calcularMinhaPosicao();
  if(posicaoAtual==null) return;
  const vista = state.profile.ranking_posicao_vista;
  state.rankingMudou = (vista!=null && vista!==posicaoAtual);
  render();
}
async function marcarRankingComoVisto(){
  if(!state.profile) return;
  const posicaoAtual = await calcularMinhaPosicao();
  if(posicaoAtual==null) return;
  state.rankingMudou = false;
  state.profile.ranking_posicao_vista = posicaoAtual;
  await supabase.from('profiles').update({ranking_posicao_vista:posicaoAtual}).eq('id',state.profile.id);
}
function iniciarRealtimeRanking(){
  if(realtimeRankingAtivo) return;
  realtimeRankingAtivo = true;
  supabase.channel('ranking_realtime')
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'profiles'}, ()=>{
      atualizarStatusRanking();
    })
    .subscribe();
}

async function atualizarContadorDesafios(){
  if(!state.profile) return 0;
  const hoje = new Date().toISOString().slice(0,10);
  const { data: chs } = await supabase.from('challenges').select('*').lte('data_inicio',hoje).gte('prazo',hoje);
  if(!chs || !chs.length){ state.desafiosPendentes = 0; render(); return 0; }
  const { data: subs } = await supabase.from('submissions').select('challenge_id,etapa,status').eq('user_id',state.profile.id).eq('status','aprovado');
  let pendentes = 0;
  for(const c of chs){
    const etapas = c.etapas||1;
    for(let n=1;n<=etapas;n++){
      const feita = (subs||[]).some(s=>s.challenge_id===c.id && (s.etapa||1)===n);
      if(!feita) pendentes++;
    }
  }
  state.desafiosPendentes = pendentes;
  render();
  return pendentes;
}
async function verificarTarefaPendenteEAvisar(){
  if(!state.profile) return;
  const pendentes = await atualizarContadorDesafios();
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  if(pendentes>0) mostrarNotificacao('FM Fitness', 'Você ainda não fez o check-in de hoje! Entre no app e cumpra seu desafio. 💪');
}
function configurarLembretes(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  if(lembreteIntervalId) return;
  setTimeout(verificarTarefaPendenteEAvisar, 4000); // aviso logo após o login, se estiver pendente
  lembreteIntervalId = setInterval(verificarTarefaPendenteEAvisar, 2*60*60*1000); // a cada 2 horas, enquanto o app estiver aberto
}
async function onAtivarLembretes(){
  if(!('Notification' in window)){ showToast('Seu navegador não suporta notificações.',false); return; }
  const perm = await Notification.requestPermission();
  if(perm==='granted'){
    showToast('Lembretes ativados! Você será avisado a cada 2h se ainda não tiver feito o desafio do dia.');
    configurarLembretes();
    render();
  } else {
    showToast('Permissão de notificação negada.',false);
  }
}

/* ======================= PWA: instalar como app + service worker ======================= */
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  setState({canInstall:true});
});
function onInstallClick(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(()=>{ deferredInstallPrompt=null; setState({canInstall:false}); });
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}

/* ======================= INIT ======================= */
render();
boot();

/* Expõe ao window apenas as funções chamadas pelos onclick/onchange do HTML */
Object.assign(window, {
  setState, onField, togglePwd, onLoginClick, onCadastroClick, handleLogout,
  openEnvioModal, onFotoSelecionada, onEnviarEvidencia, onAtualizarPeso, onAvatarSelecionado, onSalvarPerfil, onAlterarSenha,
  onGerarChave, onCriarDesafio, onSalvarEdicaoDesafio, onExcluirDesafio, onExcluirChave, onRemoverUsuario,
  onAprovarSubmissao, onConfirmarRejeicao, onDesativarUsuario, onReativarUsuario, onRenovarLicenca, onRedefinirSenha,
  onChatFotoSelecionada, onEnviarMensagemChat, onExcluirMensagem, onRemoverFotoChat, onAtivarLembretes,
  onChatTextoInput, onSelecionarMencaoInline, onFecharSugestoesMencao, onAbrirEmojis, onInserirEmoji,
  onExcluirSubmissao, onReagirEvidencia, onEnviarComentarioFeed, onExcluirComentarioFeed,
  onInstallClick
});

})();
